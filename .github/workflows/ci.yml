# Game Narrator CI gates (docs/spec/16, AGENTS.md).
#
# Runs on push to main and on PRs: make lint, make test-unit (race), the web
# checks (check:api, typecheck, lint, fmt:check, test) and make test-replay.
# The live-model, Dolphin, hardware and soak gates are intentionally NOT run
# in CI (they need private resources and are reported NOT RUN on the dev
# host — AGENTS.md rule 3/12).
#
# Action pins: full commit SHAs resolved 2026-07-20 via the GitHub API
# (GET /repos/<owner>/<repo>/tags); the version tag is kept in the comment.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Needed by the unit/replay tests that exercise real OCR and media
      # decoding (docs/spec/12 replay gate).
      - name: Install OCR and media system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-eng ffmpeg imagemagick

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod # go 1.27
          cache: true

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26 # web/package.json engines: "node": ">=22"

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # web/package.json has no packageManager field, so the version is
          # pinned here (dev host runs pnpm 12.14.0; lockfileVersion 9.0).
          version: 12.14.0
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: make lint
        run: make lint

      - name: make test-unit (race)
        run: make test-unit

      - name: Web checks (check:api, typecheck, lint, fmt:check, test)
        run: pnpm --dir web check:api typecheck lint fmt:check test

      - name: make test-replay
        run: make test-replay
