# GN-T047 (mode S) — TTS stream partial / cancel.
# Catalog: docs/test-plan/scenario-catalog.md GN-T047 "TTS stream partial/
# cancel — S,L — no stale audio, temporary file cleanup".
#
# This scenario was status: blocked while the TTS contract was atomic
# (ADR-0037 "blocked ≠ pass"); ADR-0057 gave the contract the streamed /
# cancellable synthesis endpoint it names, and the fault below is the one
# drafted for the unblock: the TTS endpoint dies while the second line is
# being synthesised.
#
# How the fault is honest: the harness drives the real tts.Client over the
# real streaming wire (the fake TTS gateway speaks the measured SSE shape,
# speech.audio.delta / speech.audio.done). The endpoint_down window is on
# the capture clock the harness stamps before each call; a streaming
# request stamped inside it gets its SSE connection dropped after half the
# audio — no terminal event. The real client classifies the mid-stream EOF
# as the endpoint-down failure, the partial is discarded, and the utterance
# ends in the session's terminal failed phase, fenced closed to a start.
# The run's playback half is the real generation-fenced scheduler over a
# filesink: the implicit audio_evidence_clean check asserts the sink's dir
# carries exactly one evidence WAV per started utterance and no temporary
# file.
# Every frame and sentence here is generated (docs/spec/11 "Fixture
# origins"); the origin field carries that claim.
schema_version: 1
catalog: GN-T047
id: synthetic/gn-t047-tts-partial-cancel
origin: generated_synthetic
profile: dialogue-advance-001
mode: frame_replay
input:
  frames_dir: testdata/synthetic/replay/dialogue-advance-001
  timestamps: timestamps.json
inference:
  decision: recorded
  tts: recorded
  voice: synthetic-narrator
faults:
  # The intended fault: the TTS endpoint dies while the second line is
  # being synthesised. The line's commit stamps the request at capture
  # 2200 ms (the matcher commits the second page on its fourth full frame);
  # this window covers that stamp and nothing earlier — the first line
  # commits at capture 1500 ms and synthesises untouched.
  - kind: endpoint_down
    role: tts
    from_ms: 2000
    to_ms: 2400
assertions:
  - type: fault_count
    kind: endpoint_down
    count: 1
  - type: no_stale_speech
    message_id: demo-page-2
  - type: no_duplicate_speech
    message_id: demo-page-2
  - type: no_voice_substitution
    voice: synthetic-narrator
