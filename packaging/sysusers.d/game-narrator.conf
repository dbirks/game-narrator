# Game Narrator system user + group (docs/spec/10 "UNO Q software deployment",
# ADR 0053). Format: type name id home shell.
#
# The single declarative definition of the user. Applied at boot by
# systemd-sysusers.service, and immediately after install/upgrade by the Arch
# .install hooks (packaging/arch/post_install.sh, post_upgrade.sh), which run
# `systemd-sysusers` when available (pacman's own systemd-sysusers
# post-transaction hook runs AFTER the scriptlets, so a fresh install must
# not rely on it) and fall back to useradd (deb parity) when it is absent.
# The .deb ships this file too, but its postinst creates the same user with
# useradd (deb behaviour is unchanged — ADR 0053); under systemd this file is
# an idempotent no-op there (the user already exists), so the two mechanisms
# agree on every attribute: system user, dedicated group, home dir, nologin
# shell, GECOS comment.
u game-narrator - "Game Narrator service" /var/lib/game-narrator /usr/sbin/nologin
