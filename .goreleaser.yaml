# Game Narrator GoReleaser pipeline (docs/spec/15).
# v2 schema; validate with `goreleaser check`. Publishing is gated for the
# GitHub Actions publish pipeline only — see docs/release.md, ADR 0033 and
# ADR 0048.
version: 2

project_name: game-narrator

# Snapshot version naming: 0.0.0-snapshot.<commit-unix-ts>.g<shortsha>
#   - Monotonic: the commit's Unix timestamp (UTC, from .CommitTimestamp) is
#     the leading, numerically compared component, so dpkg and vercmp order a
#     later commit greater than an earlier one (a bare short SHA only orders
#     lexicographically: f9a572e sorted ABOVE 0cbebce and the UNO Q apt
#     upgrade refused the newer package; ADR 0060). The .g<shortsha> keeps
#     the version traceable to its commit (and breaks same-second ties).
#   - No tilde: the version string doubles as the docker tag (dockers_v2
#     tags below are {{ .Version }}) and docker tags must match
#     [a-z0-9._-]. The .deb's control Version still sorts below every tagged
#     release: nfpm re-derives it as 0.0.0~snapshot.<ts>.g<sha> (the ~
#     makes the prerelease sort before the empty one, verified with
#     dpkg --compare-versions), and any real tag (v0.0.1+, i.e. >= 0.0.1)
#     compares greater on the upstream part anyway.
#   - Lowercase on purpose: invalid as a docker tag otherwise (ADR 0048).
# smoke.sh recovers the version from the artifact names, so the whole
# pipeline stays consistent with any template.
snapshot:
  version_template: "{{ .Version }}-snapshot.{{ .CommitTimestamp }}.g{{ .ShortCommit }}"

builds:
  - id: game-narrator
    main: ./cmd/game-narrator
    binary: game-narrator
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/dbirks/game-narrator/internal/bootstrap.version={{.Version}}
      - -X github.com/dbirks/game-narrator/internal/bootstrap.commit={{.Commit}}

# Stage the React UI for go:embed before any build (same steps as `make web-build`).
before:
  hooks:
    - make web-build

archives:
  - id: game-narrator
    # game-narrator_<version>_linux_<arch>.tar.gz (tar.gz is the v2 default)
    files:
      - README.md
      - examples/config/config.example.yaml
      - examples/config/env.example
      - packaging/systemd/game-narrator.service

checksum:
  name_template: "checksums.txt"

# SBOM per release archive (docs/spec/15 "Generate SBOM with Syft").
# cmd defaults to syft; args omit --enrich so the run works offline (enrichment
# queries external package databases).
sboms:
  - id: archives
    artifacts: archive
    documents:
      - game-narrator_{{ .Version }}_{{ .Arch }}.sbom.spdx.json
    args:
      - "$artifact"
      - "--output"
      - "spdx-json=$document"

# --- OCI image (docs/spec/15, ADR 0006, ADR 0012 Part 2) ---------------------
# dockers_v2 is verified to exist in the installed goreleaser 2.14.0 (goreleaser
# check + internal/pipe/docker/v2 source). Behaviour (2.14):
#   - snapshot runs NEVER push: images are built per platform with --load and
#     get suffixed tags (<tag>-amd64 / <tag>-arm64);
#   - tagged releases push a multi-arch manifest list with an SBOM attestation
#     (--push --attest=type=sbom) — only if GN_DOCKER_REPO is set to a
#     registry repository you own and you are logged in, e.g.
#       GN_DOCKER_REPO=ghcr.io/<owner>/game-narrator goreleaser release --clean
#     (requires explicit user approval; see docs/release.md).
# Without GN_DOCKER_REPO this section is disabled entirely, so nothing can be
# pushed by accident.
dockers_v2:
  - id: game-narrator
    # v2 semantics: images = repository names only; tags = tag templates; the
    # pipe renders <image>:<tag> per pair (and snapshot mode appends -amd64 /
    # -arm64 to each tag). .Version is the snapshot-aware version
    # (0.0.0-snapshot.<commit-ts>.g<sha> in snapshot mode, v1.2.3 on a
    # tagged release); .Tag is the raw git tag.
    disable: "{{ if not (isEnvSet \"GN_DOCKER_REPO\") }}true{{ end }}"
    dockerfile: packaging/Dockerfile
    images:
      - "{{ envOrDefault \"GN_DOCKER_REPO\" \"\" }}"
    tags:
      - "{{ .Version }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: game-narrator
      org.opencontainers.image.description: >-
        Live game narration assistant: V4L2 capture, OCR, model gateway
        narration decisions, USB audio playback. Embeds the React UI.
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .ShortCommit }}"
      org.opencontainers.image.source: https://github.com/dbirks/game-narrator
      org.opencontainers.image.licenses: UNLICENSED

# --- Keyless cosign signing of pushed OCI images (ADR 0048) -----------------
# docker_signs runs only in the publish phase, i.e. for non-snapshot runs that
# actually push (dockers_v2 pushes only when GN_DOCKER_REPO is set). Local
# snapshot runs therefore never sign or push anything. No keys in this file:
# the default cosign command is overridden WITHOUT --key, so `cosign sign`
# does keyless Sigstore signing with the GitHub Actions OIDC identity
# (permissions: id-token: write in .github/workflows/publish.yml).
# `artifacts: all` signs both the per-arch images and the multi-arch manifest
# with a tag matching the image tag.
docker_signs:
  - id: game-narrator
    cmd: cosign
    artifacts: all
    args:
      - sign
      - --yes
      - "${artifact}@${digest}"

# --- Publishing gates (docs/release.md, ADR 0048 — approved 2026-10-17) ----
# Snapshot runs imply --skip=announce,publish,validate (goreleaser 2.14), so
# `make release-snapshot` can never create a Release or push images, no
# matter what these templates evaluate to. The templates additionally gate
# the non-snapshot path: a local `goreleaser release` without CI env vars
# still cannot publish (GITHUB_ACTIONS unset => release disabled), while the
# GitHub Actions publish pipeline (publish.yml, tags v*) creates the GitHub
# Release — as a prerelease for v0.* tags.
release:
  disable: "{{ if not (isEnvSet \"GITHUB_ACTIONS\") }}true{{ end }}"
  draft: false
  prerelease: "{{ if hasPrefix .Tag \"v0.\" }}enable{{ else }}disable{{ end }}"

# Debian package for UNO Q (docs/spec/10 "UNO Q software deployment", ADR 0006)
# and the optional Arch package (docs/spec/15 "OS packages", ADR 0033 +
# ADR 0053). .rpm is intentionally omitted: there is no install-smoke
# environment for it on this host (docs/spec/15: "Optional .rpm if tested; avoid
# claiming support without install smoke").
#
# One entry builds both formats (docs/spec/15: "nFPM integration through
# GoReleaser"):
#   - deb: the shared scripts below are the packaging/deb/*.sh maintainer
#     scripts — the .deb's behaviour is unchanged (scripts byte-identical;
#     ADR 0053).
#   - archlinux: `overrides.archlinux` swaps the shared scripts for the
#     Arch .install hooks (packaging/arch/*.sh, wrapped into the package's
#     .INSTALL by nfpm) and archlinux.scripts.postupgrade adds the upgrade
#     hook (pacman 7.1 runs install/remove hooks on fresh install/remove
#     only, so upgrade setup + stop live in post_upgrade — PKGBUILD(5)).
#     The sysuser is created from the shipped sysusers.d file (hooks run
#     systemd-sysusers, useradd fallback) and directory ownership is set by
#     the hooks; the sysusers.d/tmpfiles.d files are the declarative
#     definition applied at boot (ADR 0053).
nfpms:
  - id: game-narrator
    package_name: game-narrator
    formats:
      - deb
      - archlinux
    license: unspecified # README "License: Not yet chosen" — see ADR 0033
    maintainer: "dbirks (Game Narrator project)"
    description: >-
      Live game narration assistant: captures gameplay video, reads on-screen
      text with OCR, routes narration decisions through a model gateway and
      speaks the result through a USB audio device.
    section: games
    priority: optional
    dependencies:
      - ffmpeg
      - tesseract-ocr
      - tesseract-ocr-eng
      - v4l-utils
      - ca-certificates
    scripts:
      postinstall: packaging/deb/postinst.sh
      preremove: packaging/deb/prerm.sh
      postremove: packaging/deb/postrm.sh
    # Arch-specific settings for the archlinux format only (ADR 0053): nfpm
    # wraps each file in `function <name>() { ... }` inside the package's
    # .INSTALL; the deb keeps the shared scripts above.
    overrides:
      archlinux:
        # Arch package names for the runtime dependencies. The shared list
        # above uses Debian names (tesseract-ocr / tesseract-ocr-eng), which
        # do not exist in the Arch repositories — `pacman -U` would fail with
        # "could not be found" before installing anything. Verified on the
        # Arch amd64 host (2026-10-18, `pacman -Si`): ffmpeg, tesseract,
        # tesseract-data-eng, v4l-utils in extra; ca-certificates in core.
        # goreleaser 2.14's mergeOverrides applies per-format overrides with
        # mergo.WithOverride, which REPLACES slice fields, so this is the
        # complete Arch dependency list; the .deb keeps the shared Debian
        # list unchanged.
        dependencies:
          - ffmpeg
          - tesseract
          - tesseract-data-eng
          - v4l-utils
          - ca-certificates
        scripts:
          postinstall: packaging/arch/post_install.sh
          preremove: packaging/arch/pre_remove.sh
          postremove: packaging/arch/post_remove.sh
        # nfpm merges format overrides by REPLACING the contents slice, so
        # this is the full Arch file list: same files as the base list above,
        # except the unit lands in /usr/lib/systemd/system. On Arch /lib is a
        # symlink to /usr/lib owned by the `filesystem` package, so a package
        # entry for /lib/ conflicts at install time (pacman 7.1); /usr/lib
        # is the Arch unit path and is where the .deb's /lib path resolves on
        # usrmerged Debian anyway. The .deb keeps /lib/systemd/system
        # (field-verified path, unchanged behaviour — ADR 0053).
        # Note: .PKGINFO pkgver is "0.0.0-1" for every snapshot build — the
        # nfpm core splits the version (0.0.0 + prerelease
        # snapshot.<ts>.g<sha>), the arch packager keeps only the upstream
        # part in pkgver, and appends the prerelease only when an epoch is
        # set. goreleaser 2.14 reads epoch/release/prerelease only from the
        # top-level nfpms entry (per-format overrides of them are ignored) and
        # does not template them, so any value set there would also change the
        # tagged releases' versions (the .deb would gain an epoch/-release
        # suffix) — which is off-limits (ADR 0060). Same-version `pacman -U`
        # reinstalls an explicit local file (verified 2026-10-18), so upgrades
        # between snapshot builds work; provenance is via checksums.txt /
        # artifact names, not `pacman -Qi` (docs/release.md). The version
        # string itself is vercmp-monotonic (verified 2026-10-18 with
        # pacman's vercmp 7.1.0), so the wart stays cosmetic.
        contents:
          - src: packaging/systemd/game-narrator.service
            dst: /usr/lib/systemd/system/game-narrator.service
            file_info:
              mode: 0o644
          # Explicit dir entry: the hook sets root:game-narrator 0750 on
          # /etc/game-narrator; without this the implicit entry records
          # root:root 0755 and pacman warns "directory permissions differ"
          # on every install/upgrade. (The deb keeps its implicit entry —
          # dpkg does not warn and deb behaviour is unchanged.)
          - dst: /etc/game-narrator
            type: dir
            file_info:
              owner: root
              group: game-narrator
              mode: 0o750
          - src: examples/config/config.example.yaml
            dst: /etc/game-narrator/config.yaml
            type: config|noreplace
            file_info:
              mode: 0o640
          - src: examples/config/env.example
            dst: /etc/game-narrator/env.example
            file_info:
              mode: 0o640
          - src: packaging/sysusers.d/game-narrator.conf
            dst: /usr/lib/sysusers.d/game-narrator.conf
            file_info:
              mode: 0o644
          - src: packaging/tmpfiles.d/game-narrator.conf
            dst: /usr/lib/tmpfiles.d/game-narrator.conf
            file_info:
              mode: 0o644
    archlinux:
      packager: "dbirks (Game Narrator project)"
      scripts:
        # pacman 7.1: on upgrades only the pre/post_upgrade hooks run (the
        # install/remove hooks do NOT), so the deb-equivalent setup + stop-on-
        # upgrade lives here (post_install covers fresh installs).
        postupgrade: packaging/arch/post_upgrade.sh
    contents:
      - src: packaging/systemd/game-narrator.service
        dst: /lib/systemd/system/game-narrator.service
        file_info:
          mode: 0o644
      - src: examples/config/config.example.yaml
        dst: /etc/game-narrator/config.yaml
        type: config|noreplace
        file_info:
          mode: 0o640
      - src: examples/config/env.example
        dst: /etc/game-narrator/env.example
        file_info:
          mode: 0o640
      # Declarative user + directory entries (ADR 0053), shipped in BOTH
      # formats. On the .deb they are inert without systemd (the bookworm
      # container smoke runs systemd-free) and idempotent under systemd
      # (postinst creates the same user/dirs — deb behaviour is unchanged).
      # On Arch they are the user/directory definition applied by the hooks.
      - src: packaging/sysusers.d/game-narrator.conf
        dst: /usr/lib/sysusers.d/game-narrator.conf
        file_info:
          mode: 0o644
      - src: packaging/tmpfiles.d/game-narrator.conf
        dst: /usr/lib/tmpfiles.d/game-narrator.conf
        file_info:
          mode: 0o644
      # Note: /var/lib/game-narrator is deliberately NOT a package entry in
      # either format — it is created/owned by the maintainer scripts (deb
      # postinst) / the Arch .install hooks via the tmpfiles line above.
      # A package-owned data dir would make removal semantics ambiguous
      # (pacman -R on a non-empty dir) and weaken the "never deleted by the
      # package" guarantee (docs/spec/15, docs/release.md section 5).
