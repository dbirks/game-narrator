# Game Narrator publishing (docs/release.md, ADR 0048 — user-approved 2026-10-17).
#
# Two flows, one file:
#   1. edge: a push to main after the ci workflow succeeds (workflow_run) —
#      GoReleaser snapshot build (per-arch images locally), artifact scan that
#      must pass BEFORE any push, push of the per-arch images, then the
#      multi-arch manifest tags `edge` and `sha-<short>` assembled registry-
#      side via `docker buildx imagetools create` (manifest lists can only
#      reference images already in a registry, never local-only ones), then
#      cosign keyless signature + SBOM attestation on the manifest digest.
#   2. release: a v* tag — GoReleaser release --clean: archives, .debs,
#      SBOMs, GitHub Release (prerelease for v0.* tags) and the multi-arch
#      image push + keyless cosign signing (docker_signs in .goreleaser.yaml).
#
# Both flows use the repo's GITHUB_TOKEN only (permissions: packages: write,
# id-token: write). cosign is keyless (Sigstore Fulcio + CT via GitHub OIDC):
# no private keys, no external credentials, nothing secret in this repo.
#
# Action pins: full commit SHAs resolved 2026-07-20 via the GitHub API
# (GET /repos/<owner>/<repo>/tags); the version tag is kept in the comment.
name: publish

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  edge:
    if: >-
      github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    concurrency:
      group: publish-edge
      cancel-in-progress: false
    steps:
      - name: Checkout (the commit the passing CI run validated)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod # go 1.27
          cache: true

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.14.0
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml

      - name: "Install web dependencies (goreleaser before-hook: make web-build)"
        run: pnpm --dir web install --frozen-lockfile

      - name: Set up QEMU (arm64 image build)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: amd64, arm64

      - name: Set up BuildKit
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign (keyless via GitHub OIDC)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Install syft (goreleaser sboms pipe)
        run: |
          set -euo pipefail
          SYFT_VER=1.54.1
          curl -fsSL "https://github.com/anchore/syft/releases/download/v${SYFT_VER}/syft_${SYFT_VER}_linux_amd64.tar.gz" -o /tmp/syft.tgz
          sudo tar -C /usr/local/bin -xzf /tmp/syft.tgz syft
          syft version

      - name: GoReleaser snapshot (per-arch images built locally; snapshot never pushes)
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.14.0
          args: release --snapshot --clean
        env:
          GN_DOCKER_REPO: ghcr.io/dbirks/game-narrator

      - name: Scan release artifacts (must pass before any push)
        run: |
          set -euo pipefail
          SHORT="$(git rev-parse --short=7 HEAD)"
          BASE="0.0.0-snapshot-${SHORT}"
          GN_SCAN_IMAGE="ghcr.io/dbirks/game-narrator:${BASE}-amd64 ghcr.io/dbirks/game-narrator:${BASE}-arm64" \
            scripts/release/scan-artifacts.sh

      - name: Push per-arch images (scanned; manifest tags not created yet)
        run: |
          set -euo pipefail
          SHORT="$(git rev-parse --short=7 HEAD)"
          REPO="ghcr.io/dbirks/game-narrator"
          BASE="0.0.0-snapshot-${SHORT}"
          docker push "${REPO}:${BASE}-amd64"
          docker push "${REPO}:${BASE}-arm64"

      - name: Create multi-arch manifest tags (edge, sha-<short>) via buildx imagetools
        run: |
          set -euo pipefail
          SHORT="$(git rev-parse --short=7 HEAD)"
          REPO="ghcr.io/dbirks/game-narrator"
          BASE="0.0.0-snapshot-${SHORT}"
          # A manifest list can only reference images that already exist in
          # a registry, so the per-arch images are pushed above first; this
          # assembles the multi-arch tags registry-side (no local manifest
          # state, no docker manifest create/push).
          docker buildx imagetools create \
            -t "${REPO}:edge" \
            -t "${REPO}:sha-${SHORT}" \
            "${REPO}:${BASE}-amd64" "${REPO}:${BASE}-arm64"
          # registry-side validation that both children are present
          docker buildx imagetools inspect "${REPO}:edge" >/dev/null

      - name: Sign manifest digest + attach SBOM attestation (cosign keyless)
        run: |
          set -euo pipefail
          REPO="ghcr.io/dbirks/game-narrator"
          DIGEST="$(docker buildx imagetools inspect --format '{{json .Manifest}}' "${REPO}:edge" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["Digest"])')"
          case "${DIGEST}" in sha256:*) : ;; *) echo "manifest digest not found for ${REPO}:edge" >&2; exit 1 ;; esac
          SBOM="$(ls dist/game-narrator_*_amd64.sbom.spdx.json | head -n1)"
          echo "attaching SBOM: ${SBOM}"
          cosign sign --yes "${REPO}@${DIGEST}"
          cosign attest --yes --type spdxjson --predicate "${SBOM}" "${REPO}@${DIGEST}"
          echo "signed manifest: ${REPO}@${DIGEST}"

      - name: Verify signature (self-check, mirrors docs/release.md)
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity-regexp 'https://github.com/dbirks/game-narrator/.github/workflows/publish.yml@.*' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            ghcr.io/dbirks/game-narrator:edge

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout (full history so the tag is visible to goreleaser)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod # go 1.27
          cache: true

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.14.0
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml

      - name: "Install web dependencies (goreleaser before-hook: make web-build)"
        run: pnpm --dir web install --frozen-lockfile

      - name: Set up QEMU (arm64 image build)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: amd64, arm64

      - name: Set up BuildKit
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Install cosign (keyless via GitHub OIDC; docker_signs + action signature check)"
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Install syft (goreleaser sboms pipe)
        run: |
          set -euo pipefail
          SYFT_VER=1.54.1
          curl -fsSL "https://github.com/anchore/syft/releases/download/v${SYFT_VER}/syft_${SYFT_VER}_linux_amd64.tar.gz" -o /tmp/syft.tgz
          sudo tar -C /usr/local/bin -xzf /tmp/syft.tgz syft
          syft version

      # Builds everything, pushes the multi-arch image (tag = v1.2.3) with the
      # goreleaser SBOM attestation, signs per-arch images + manifest via
      # docker_signs (keyless cosign) and creates the GitHub Release
      # (prerelease for v0.* — see the release block in .goreleaser.yaml).
      - name: GoReleaser release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.14.0
          args: release --clean
        env:
          GN_DOCKER_REPO: ghcr.io/dbirks/game-narrator
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan release archives and .debs (post-build; image layers covered by pinned base digest + image SBOM attestation)
        run: scripts/release/scan-artifacts.sh

      - name: Verify signature (self-check, mirrors docs/release.md)
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          cosign verify \
            --certificate-identity-regexp 'https://github.com/dbirks/game-narrator/.github/workflows/publish.yml@.*' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "ghcr.io/dbirks/game-narrator:${TAG}"
