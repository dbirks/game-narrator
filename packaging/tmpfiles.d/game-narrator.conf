# Game Narrator directories (docs/spec/10 "UNO Q software deployment",
# ADR 0053). Format: type path mode user group age content.
#
# Applied at boot by systemd-tmpfiles-setup.service (idempotent: enforces the
# owner/mode below). The Arch .install hooks set the same ownership directly
# with install/chown after install/upgrade — they do NOT call systemd-tmpfiles,
# which on the 2026-10-18 dev host could not resolve any non-root user name
# ("Unknown user") — so at install time the hook is the effective mechanism
# and this file is the boot-time enforcer. `d` creates the directory if
# missing and enforces owner/mode if present; it NEVER deletes an existing
# directory. That is the purge contract: /var/lib/game-narrator is user data
# (catalogue + assets) and is never removed by the package — deletion is an
# explicit admin act (docs/spec/15, docs/release.md sections 5 and 6). The
# .deb ships this file too; its postinst creates the same directories (deb
# behaviour unchanged), so the tmpfiles lines are idempotent under systemd
# there.
d /var/lib/game-narrator 0750 game-narrator:game-narrator -
d /etc/game-narrator     0750 root:game-narrator          -
