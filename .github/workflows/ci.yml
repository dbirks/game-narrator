# Game Narrator CI gates (docs/spec/16, AGENTS.md).
#
# Runs on push to main and on PRs: make lint, make test-unit (race), the web
# checks (check:api, typecheck, lint, fmt:check, test) and make test-replay.
# The live-model, Dolphin, hardware and soak gates are intentionally NOT run
# in CI (they need private resources and are reported NOT RUN on the dev
# host — AGENTS.md rule 3/12).
#
# Failure visibility: job logs require GitHub authentication, but check-run
# annotations are public (GET /repos/<owner>/<repo>/check-runs/<id>/
# annotations). Each test gate therefore runs the test tool with a
# machine-readable reporter (go test -json, the vitest json reporter), tees
# the output to a file under artifacts/ci/ (gitignored), and pipes it through
# scripts/gates/annotate-go.sh / annotate-vitest.sh. The annotators emit one
# ::error per failing test (file=, title=, first 3 lines of failure output,
# capped at 20 annotations) and one ::notice with the PASS/FAIL/SKIP totals.
# They follow the classification and message-extraction conventions of the
# scripts/gates/junit summariser (which parses go test -json but does not
# emit annotations). Annotators always exit 0, so each gate's exit code still
# comes from the test tool itself.
#
# Action pins: full commit SHAs resolved 2026-07-20 via the GitHub API
# (GET /repos/<owner>/<repo>/tags); the version tag is kept in the comment.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history for the secret-scan history mode (cheap: ~14 MB /
          # tens of commits, so the default shallow depth buys nothing).
          fetch-depth: 0

      # Needed by the unit/replay tests that exercise real OCR and media
      # decoding (docs/spec/12 replay gate).
      - name: Install OCR and media system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-eng ffmpeg imagemagick

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod # go 1.27
          cache: true

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26 # web/package.json engines: "node": ">=22"

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # web/package.json has no packageManager field, so the version is
          # pinned here (dev host runs pnpm 12.14.0; lockfileVersion 9.0).
          version: 12.14.0
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: make lint
        run: make lint

      # The "no secrets / private endpoints / game data in Git" gate
      # (AGENTS.md rule 5) in history mode: tracked files plus the added
      # lines of every commit (the fetch-depth: 0 checkout above makes the
      # full history available). The self-test proves the scanner still
      # detects planted synthetic samples on the runner, so a clean result
      # is evidence, not a vacuous pass. Findings print path:line + rule
      # only — matched values are never printed (masked).
      - name: Secret scan (tree + full history) with self-test
        run: |
          scripts/gates/secret-scan.sh --self-test
          scripts/gates/secret-scan.sh --history

      # make test-unit (docs/spec/16) is `go vet ./...` + `go test -race
      # -timeout 25m ./...`. Local behaviour is unchanged; CI invokes the same
      # commands directly, adding -json to go test so every failing test becomes
      # a public check-run annotation (job logs need GitHub auth; the
      # annotations are the public surface). Keep the package set (`./...`),
      # the flags (`-race`), and the explicit `-timeout 25m` (issue #15: the
      # implicit 10-minute per-package default has already killed a run under
      # load) in sync with the Makefile target when it changes.
      # set +o pipefail: the step must reach the annotator even
      # when go test fails (the pipeline's exit code is tee's).
      - name: make test-unit (race) as go vet + go test -race -json ./...
        run: |
          set +o pipefail
          mkdir -p artifacts/ci
          if ! go vet ./...; then
            echo "::error::go vet ./... failed — see the step log (job logs require GitHub auth)"
            exit 1
          fi
          go test -race -timeout 25m -json ./... 2>artifacts/ci/test-unit.stderr \
            | tee artifacts/ci/test-unit.json
          rc=${PIPESTATUS[0]}
          scripts/gates/annotate-go.sh artifacts/ci/test-unit.json "go test (unit)"
          exit "$rc"

      - name: Web checks (check:api, typecheck, lint, fmt:check)
        run: pnpm --dir web check:api typecheck lint fmt:check

      # Web unit tests: `pnpm --dir web test` is `vitest run`
      # (docs/spec/16). CI adds the built-in json reporter so failures
      # become public check-run annotations. --outputFile.json=... is the
      # vitest >= 5 dot-notation form; a plain --outputFile string is
      # ignored when multiple --reporter flags are given (verified against
      # vitest 5.0.5 CLI parsing). The default reporter still prints the
      # human-readable output to the log; the report lands in
      # artifacts/ci/ (gitignored), relative to the web/ project root.
      - name: Web unit tests (vitest) with JSON report
        run: |
          rc=0
          pnpm --dir web test \
            --reporter=default --reporter=json \
            --outputFile.json=../artifacts/ci/web-test.json || rc=$?
          scripts/gates/annotate-vitest.sh \
            artifacts/ci/web-test.json "${GITHUB_WORKSPACE:-.}"
          exit "$rc"

      # make test-replay runs scripts/gates/run-go-gate.sh, which already
      # tees the go test -json stream to artifacts/gates/test-replay.json;
      # the annotator reuses that stream. NOT RUN semantics are preserved
      # (the gate keeps its own 0/1/2 exit code; the annotator exits 0).
      - name: make test-replay
        run: |
          rc=0
          make test-replay || rc=$?
          scripts/gates/annotate-go.sh artifacts/gates/test-replay.json "go test (replay)"
          exit "$rc"

      # A -race failure's report lives in the go test -json Output events,
      # which the annotators truncate to 3 lines and the runner discards: a
      # rare CI-only race (2026-10-22, gn-t025-catch-up) could not be
      # diagnosed. On failure, print every DATA RACE report in full.
      - name: print data race reports
        if: failure()
        run: |
          for f in artifacts/gates/*.json artifacts/ci/*.json; do
            [ -f "$f" ] || continue
            jq -r 'select(.Action=="output") | .Output' "$f" 2>/dev/null \
              | awk '/WARNING: DATA RACE/{p=1} p{print} p && /^==================$/{p=0}' \
              | head -400
          done
